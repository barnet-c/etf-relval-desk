# nginx config for the etf-relval-desk SPA on Azure Container Apps.
# Listens on 8080 (ACA target port); serves the CRA build with SPA fallback and
# a correct MIME type for the .csv datasets the app fetches from /plotted_datasets.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve .csv as text/csv (nginx's default mime.types omits it).
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js;
        application/json                      json map;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/x-icon                          ico;
        text/csv                              csv;
        text/plain                            txt;
    }
    default_type application/octet-stream;

    # Long-cache the fingerprinted CRA assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown routes -> index.html (matches staticwebapp.config.json).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }
}
